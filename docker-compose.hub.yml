# Quick-start using the pre-built images from Docker Hub.
# No local build required. The author's original images are used as-is.
services:
  scraperr:
    image: jpyles0524/scraperr:latest
    container_name: scraperr_frontend
    command: ["sh", "-c", "cd /app && npm run start"]
    environment:
      - NEXT_PUBLIC_API_URL=http://scraperr_api:8000
      - SERVER_URL=http://scraperr_api:8000
    ports:
      - "3000:3000"
    depends_on:
      - scraperr_api
    networks:
      - web

  scraperr_api:
    image: jpyles0524/scraperr_api:latest
    container_name: scraperr_api
    environment:
      - LOG_LEVEL=INFO
      - OPENAI_KEY=${OPENAI_KEY:-}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - "$PWD/data:/project/app/data"
      - "$PWD/media:/project/app/media"
    networks:
      - web

networks:
  web:
